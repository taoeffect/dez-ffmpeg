# Added for Dez.
# Once a week: merge the new commits of the Shaka Project's repository, and
# move each library that Dez adds to its newest stable tag that is at least
# 14 days old (update-dez-libraries.sh).  The result goes to the branch
# sync/upstream, with one pull request and a build of all targets.  Nothing
# here tags or releases: a person merges the pull request and tags.
#
# When the merge has a conflict, or changes .github/workflows/ (which the
# token of a workflow cannot push), the workflow opens an issue instead.
#
# Notes:
#  - A pull request that the workflow token opens starts no other workflow,
#    so this workflow runs the build itself.
#  - GitHub turns off a scheduled workflow after 60 days with no activity in
#    the repository, and sends an email to turn it on again.

name: Sync upstream

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "The minimum age of a new library release, in days"
        required: false
        type: string
        default: "14"

permissions:
  contents: read

concurrency:
  group: sync-upstream

defaults:
  run:
    shell: bash

env:
  UPSTREAM_URL: https://github.com/shaka-project/static-ffmpeg-binaries
  BRANCH: sync/upstream

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      pr: ${{ steps.publish.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the changes of the Shaka Project
        id: merge
        run: |
          set -e
          set -x

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH" main

          git fetch "$UPSTREAM_URL" main
          git log --no-merges --format='- %s (%h)' HEAD..FETCH_HEAD > "$RUNNER_TEMP/upstream.txt"

          if ! git merge --no-edit -m "Merge the changes of the Shaka Project" FETCH_HEAD; then
            git merge --abort
            echo "problem=conflict" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$(git diff --name-only main HEAD -- .github/workflows)" ]]; then
            echo "problem=workflows" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the libraries that Dez adds
        if: steps.merge.outputs.problem == ''
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '14' }}
        run: |
          set -e
          set -x

          ./update-dez-libraries.sh | sed -e 's/^/- /' > "$RUNNER_TEMP/libraries.txt"
          if [[ -s "$RUNNER_TEMP/libraries.txt" ]]; then
            git commit -a \
                -m "Update the libraries that Dez adds" \
                -m "$(cat "$RUNNER_TEMP/libraries.txt")"
          fi

      - name: Push the branch and open the pull request
        id: publish
        if: steps.merge.outputs.problem == ''
        run: |
          set -e
          set -x

          tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$tree" == "$(git rev-parse 'main^{tree}')" ]]; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The same files as the branch of an earlier run: no new push,
          # build, or comment.
          if git fetch origin "$BRANCH" &&
              [[ "$tree" == "$(git rev-parse 'FETCH_HEAD^{tree}')" ]]; then
            echo "The branch $BRANCH has these changes already."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh auth setup-git
          git push --force origin "$BRANCH"

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Made by the Sync upstream workflow: $run_url"
            echo
            echo "## Changes of the Shaka Project"
            echo
            cat "$RUNNER_TEMP/upstream.txt"
            [[ -s "$RUNNER_TEMP/upstream.txt" ]] || echo "None."
            echo
            echo "## Libraries that Dez adds"
            echo
            cat "$RUNNER_TEMP/libraries.txt"
            [[ -s "$RUNNER_TEMP/libraries.txt" ]] || echo "None."
            echo
            echo "The same workflow run builds all targets from this branch, and adds its result as a comment."
            echo "After the merge, tag a release by hand (README, \"Tag names\")."
          } > "$RUNNER_TEMP/body.md"

          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --base main --head "$BRANCH" \
                --title "Sync with the Shaka Project and update libraries" \
                --body-file "$RUNNER_TEMP/body.md")
            pr="${url##*/}"
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          fi

          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open an issue for a merge by hand
        if: steps.merge.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.merge.outputs.problem }}
        run: |
          set -e
          set -x

          title="Sync upstream: merge the Shaka Project's changes by hand"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [[ "$open" != "0" ]]; then
            echo "The issue is open already."
            exit 0
          fi

          if [[ "$PROBLEM" == "conflict" ]]; then
            reason="The changes of the Shaka Project do not merge with the changes of Dez: there is a conflict."
          else
            reason="The changes of the Shaka Project change files in .github/workflows/, and the token of a workflow cannot push them."
          fi

          {
            echo "$reason"
            echo
            echo "Commits of the Shaka Project that main does not have:"
            echo
            cat "$RUNNER_TEMP/upstream.txt"
            echo
            echo "To merge them by hand:"
            echo
            echo '```sh'
            echo "git switch main && git pull"
            echo "git fetch $UPSTREAM_URL main"
            echo "git merge FETCH_HEAD    # fix the conflicts, if any, then commit"
            echo "./update-dez-libraries.sh"
            echo "git push origin main"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"

          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      ref: sync/upstream

  report:
    needs: [update, build]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.update.outputs.pr }}
      RESULT: ${{ needs.build.result }}
    steps:
      - name: Add the build result to the pull request
        run: |
          set -e
          set -x

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr comment "$PR" -R "${{ github.repository }}" \
              --body "Build of all targets from this branch: **$RESULT**. Run: $run_url"
