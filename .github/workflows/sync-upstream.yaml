# Added for Dez.
# Once a week: merge the new commits of the Shaka Project's repository, and
# move the ffmpeg pin and each library that Dez adds to its newest stable
# tag that is at least 14 days old (sync-scripts/update-versions.sh).  The
# result goes to the branch sync/upstream, with one pull request and a build
# of all targets.  Nothing here tags or releases: a person merges the pull
# request and tags.
#
# The Shaka Project moves the ffmpeg pin too, on a line of its own block,
# so the merge can stop there: sync-scripts/merge-versions.sh then keeps the
# newer pin.  When the merge has another conflict, or changes
# .github/workflows/ (which the token of a workflow cannot push), the
# workflow opens an issue instead.
#
# Each step of the update job runs one script of sync-scripts/, whose
# comment tells what the step does.
#
# Notes:
#  - A pull request that the workflow token opens starts no other workflow,
#    so this workflow runs the build itself.
#  - GitHub turns off a scheduled workflow after 60 days with no activity in
#    the repository, and sends an email to turn it on again.

name: Sync upstream

on:
  schedule:
    # Mondays at 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      min_age_days:
        description: "The minimum age of a new release of ffmpeg or of a library, in days"
        required: false
        type: string
        default: "14"

permissions:
  contents: read

concurrency:
  group: sync-upstream

defaults:
  run:
    shell: bash

env:
  UPSTREAM_URL: https://github.com/shaka-project/static-ffmpeg-binaries
  BRANCH: sync/upstream
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      pr: ${{ steps.publish.outputs.pr }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the changes of the Shaka Project
        id: merge
        run: sync-scripts/merge-upstream.sh

      - name: Update ffmpeg and the libraries that Dez adds
        if: steps.merge.outputs.problem == ''
        env:
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '14' }}
        run: sync-scripts/commit-updates.sh

      - name: Push the branch and open the pull request
        id: publish
        if: steps.merge.outputs.problem == ''
        run: sync-scripts/publish.sh

      - name: Open an issue for a merge by hand
        if: steps.merge.outputs.problem != ''
        env:
          PROBLEM: ${{ steps.merge.outputs.problem }}
        run: sync-scripts/open-issue.sh

  build:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build.yaml
    with:
      ref: sync/upstream

  report:
    needs: [update, build]
    if: always() && needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.update.outputs.pr }}
      RESULT: ${{ needs.build.result }}
    steps:
      - name: Add the build result to the pull request
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
              --body "Build of all targets from this branch: **$RESULT**. Run: $RUN_URL"
